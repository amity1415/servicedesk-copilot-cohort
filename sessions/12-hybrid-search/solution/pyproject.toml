[project]
name = "servicedesk-copilot-course"
version = "0.12.0"
description = "Completed cumulative IT Copilot source for session 12"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5", "pypdf>=5,<8", "python-docx>=1.1,<2", "PyYAML>=6,<7", "pydantic>=2.7", "pydantic-settings>=2.3", "scikit-learn>=1.5,<2", "tiktoken>=0.7,<1", "httpx>=0.27,<1", "opentelemetry-api>=1.30,<2"]

[project.optional-dependencies]
rag-local = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "huggingface-hub>=0.26,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
